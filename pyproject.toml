[project]

name = "doc-gen"

dynamic = ["version"]
# version = "1.0.2"
# With this the version will be auto-generated from git tags using setuptools_scm
# When run
# pip install
# or
# python -m build
# it will extract the version from Git tag and use it automatically.
#
# To use the auto version inside code:
# ```python
# from importlib.metadata import version
# __version__ = version("currency-conversion-api")
# ✅ This will always return the version from Git tag if setuptools_scm is used properly.

description = "Configuration-driven CLI for generating, printing, and analyzing repository structure documentation in Markdown."

readme = "README.md"

requires-python = ">=3.9"

license = { text = "MIT" }

authors = [
    { name = "Rizky Fernandes (devalltect00)", email = "devalltect00@gmail.com"},
]

maintainers = [
    { name = "Rizky Fernandes (devalltect00)", email = "devalltect00@gmail.com"},
]

keywords = [
    "documentation-generator",
    "doc-gen",
    "project-structure",
    "project-tree",
    "project-documentation",
    "repository-analysis",
    "repo-tree",
    "documentation",
    "documentation-tool",
    "developer-tools",
    "cli",
    "cli-tool",
    "automation",
    "markdown",
    "markdown-generator",
    "smart-mode",
    "python",
    "typer",
    "rich",
    "docker",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",

    "Intended Audience :: Developers",

    "License :: OSI Approved :: MIT License",

    "Operating System :: OS Independent",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Environment :: Console",

    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

dependencies = [
    # CLI Framework
    "typer>=0.12.0",
    "click>=8.1.7",

    # Terminal UI
    "rich>=13.7.0",
    "pyfiglet>=1.0.4",

    # Python 3.9-3.10 TOML compatibility
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]

# Runtime-compatible test dependencies used by the Python 3.9-3.14 CI matrix.
# Developer quality tools are intentionally kept in `dev` because their own
# interpreter requirements may be newer than Doc-Gen's package compatibility.
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "packaging>=24.0",
    "PyYAML>=6.0.2",
]

dev = [
    # Test
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "PyYAML>=6.0.2",

    # Formatting
    "black==26.5.1",

    # Linting
    "ruff==0.16.5",

    # Packaging
    "build>=1.2.0",
    "packaging>=24.0",
    "twine>=5.0.0",

    # Git hooks
    "pre-commit>=3.7.0",

    # related to `AREPL for python` vscode extensions
    "ipykernel",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.urls]

Homepage = "https://github.com/devalltect00/Doc-Gen"
Repository = "https://github.com/devalltect00/Doc-Gen"
Issues = "https://github.com/devalltect00/Doc-Gen/issues"
## Documentation = "https://devalltect00.github.io/Doc-Gen/"
Documentation = "https://devalltect00.github.io/devalltect-docs/docs/doc-gen"
Changelog = "https://github.com/devalltect00/Doc-Gen/blob/main/CHANGELOG.md"
Discussions = "https://github.com/devalltect00/Doc-Gen/discussions"
Releases = "https://github.com/devalltect00/Doc-Gen/releases"
"GitHub Actions" = "https://github.com/devalltect00/Doc-Gen/actions"
"GitLab CI" = "https://gitlab.com/devalltects-group/Doc-Gen/-/pipelines"
"Container Images" = "https://github.com/devalltect00/Doc-Gen/pkgs/container/doc-gen"

[tool.devalltect.github]

# Curated GitHub repository topics are maintained separately from the broader
# Python package-discovery keywords under [project]. This table stores desired
# metadata only; applying it to GitHub requires an explicit synchronization.
topics = [
    "doc-gen",
    "documentation-generator",
    "project-structure",
    "project-tree",
    "project-documentation",
    "repository-analysis",
    "repository-tools",
    "documentation",
    "markdown",
    "markdown-generator",
    "developer-tools",
    "automation",
    "smart-mode",
    "dry-run",
    "cli",
    "python",
]

[tool.devalltect.gitlab]

# Curated GitLab project topics are maintained separately from GitHub topics
# and the broader Python package-discovery keywords under [project]. This table
# stores desired metadata only; applying it to GitLab requires explicit
# synchronization. Do not include credentials or other sensitive information.
topics = [
    "doc-gen",
    "documentation-generator",
    "project-structure",
    "project-tree",
    "project-documentation",
    "repository-analysis",
    "repository-tools",
    "documentation",
    "markdown",
    "markdown-generator",
    "developer-tools",
    "automation",
    "smart-mode",
    "dry-run",
    "cli",
    "python",
]

[project.scripts]

doc-gen = "doc_gen.cli.main:main"

# =========================================================
# TYPER
# =========================================================

[tool.typer]

pretty_exceptions_enable = true

# =========================================================
# SETUPTOOLS
# =========================================================

[tool.setuptools]

package-dir = { "" = "app" }

[tool.setuptools.packages.find]

where = [
    "app",
]

exclude = ["venv*"]

[tool.setuptools.package-data]
doc_gen = [
    "templates/**/*",
    "templates/*.toml",
    "templates/**/*.toml",
    "templates/*.py",
    "templates/**/*.py",
    "templates/*.txt",
    "templates/**/*.txt",
    "templates/*.md",
    "templates/**/*.md",
]

# =========================================================
# SETUPTOOLS_SCM
# =========================================================

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"

fallback_version = "1.0.2"

# =========================================================
# PYTEST
# =========================================================

[tool.pytest.ini_options]

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = [
    # -----------------------------------------------------
    # Summary
    # -----------------------------------------------------

    "-ra",                          # Show extra test summary info for skipped, failed, xfailed, etc.

    # -----------------------------------------------------
    # Validation
    # -----------------------------------------------------

    "--strict-markers",             # Fail on unknown pytest markers.
    "--strict-config",              # Fail on invalid or unknown pytest configuration.

    # -----------------------------------------------------
    # Output
    # -----------------------------------------------------

    "--tb=short",                   # Use shorter traceback output.

    # -----------------------------------------------------
    # COVERAGE
    # -----------------------------------------------------

    "--cov=app",                    # Enable coverage. Measure test coverage for the app package.
    "--cov-report=term-missing",    # Shows missing lines directly in terminal output.

    # -----------------------------------------------------
    # IMPORTS
    # -----------------------------------------------------

    "--import-mode=importlib",      # Fixes import conflicts with same-named test files
]

filterwarnings = [
    "ignore::DeprecationWarning",
]

# =========================================================
# BLACK
# =========================================================

[tool.black]

line-length = 88
# Format source for the package's declared Python 3.9 compatibility floor.
target-version = ["py39"]

# Preserve inactive migration/reference files even when paths are supplied
# explicitly by pre-commit, an editor, or a developer command.
force-exclude = '''
(
    /dev_venv/
  | /prod_venv/
  | /venv_dev/
  | /venv_prod/
  | /publish_venv/
  | /venv_publish/
  | /other_venv/
  | /venv_other/
  | /old/
  | /example_before/
  | /config_before/
  | \.deprecated\.py$
  | \.old[^/]*\.py$
  | \.dev\.py$
  | [ _]copy\.py$
  | _temp\.py$
  | _temp_before\.py$
)
'''

# =========================================================
# RUFF
# =========================================================

[tool.ruff]

line-length = 88
target-version = "py39"

# Respect `exclude` even when pre-commit or another caller supplies file paths
# explicitly instead of relying on Ruff's recursive file discovery.
force-exclude = true

exclude = [
    ".git",
    ".venv",
    "venv",
    "dev_venv",
    "prod_venv",
    "venv_dev",
    "venv_prod",
    "publish_venv",
    "venv_publish",
    "other_venv",
    "venv_other",
    "__pycache__",
    "build",
    "dist",
    "**/old/**",
    "**/example_before/**",
    "**/config_before/**",
    "**/*.deprecated.py",
    "**/*.old*.py",
    "**/*.dev.py",
    "**/* copy.py",
    "**/*_copy.py",
    "**/*_temp.py",
    "**/*_temp_before.py",
]

# =========================================================
# RUFF LINT
# =========================================================

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle Warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

ignore = [
    "UP045",    # pyupgrade. Ignore checking for example: 'Optional[str]' -> 'str | None'
    "COM812",   # flake8-commas. Ignore trailing comma
    "E501",     # line-too-long
    "UP042",     # pyupgrade StrEnum suggestion

    # Additional (temporary - skipped)
    "UP035",
    "UP006",
    "B007",
]

[tool.ruff.lint.isort]

known-first-party = ["doc_gen"]

[tool.ruff.lint.per-file-ignores]

"app/cli/commands/**/*.py" = ["F403", "F405"]

# =========================================================
# RUFF FORMAT
# =========================================================

[tool.ruff.format]

quote-style = "double"
indent-style = "space"
line-ending = "auto"

# =========================================================
# BUILD SYSTEM
# =========================================================

[build-system]

requires = [
    "setuptools>=68",
    "setuptools-scm>=8",
    "wheel",
]

build-backend = "setuptools.build_meta"

# =========================================================
# COVERAGE
# =========================================================

[tool.coverage.run]

source = ["app"]

[tool.coverage.report]

show_missing = true
skip_covered = false
