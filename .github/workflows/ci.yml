# .github/workflows/ci.yml

name: 🧪 Continuous Integration

run-name: ✅ CI Validation • ${{ github.ref_name }}

# =========================================================
# 🧪 Continuous Integration Workflow
# ---------------------------------------------------------
# Purpose:
# - Run tests on every push to main
# - Run tests on every Pull Request
# - Ensure compatibility across multiple Python versions
#
# Why matrix?
# - Guarantees your package works across Python versions
# =========================================================

on:
  push:
    branches:
      - main
      - develop
      - dev
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - develop
      - dev

  workflow_dispatch:

jobs:
  test:
    name: 🧪 Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # -----------------------------------------------------
    # Run tests across multiple Python versions
    # -----------------------------------------------------
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          # - "3.12"
          # - "3.13"
          - "3.14"

    steps:
      # 📥 Checkout repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🐍 Setup Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip" # ⚡ Speeds up dependency installation

      # 📦 Install the runtime-compatible test toolchain.
      - name: 📦 Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: 🧪 Run compatibility tests
        run: make test-ci

  quality:
    name: 🧹 Quality (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: 📦 Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 🎨 Check formatting
        run: make format-check-ci

      - name: 🔍 Run lint checks
        run: make lint-ci
