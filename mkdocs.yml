site_name: ⛶ Doc Gen
site_description: Configuration-driven CLI for generating, printing, and analyzing repository structure documentation in Markdown.
# site_url: https://mydomainsite.com
site_url: http://localhost:8001
site_author: Devalltect00

repo_name: Doc-Gen
repo_url: https://github.com/devalltect00/Doc-Gen

#gitlab
# edit_uri: -/edit/main/backend/docs
#github
# edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Fira Code
  icon:
    logo: fontawesome/solid/d
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - toc.integrate
    - header.autohide
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - codehilite
  - md_in_html
  - tables

  - toc:
      permalink: true

  - pymdownx.keys
  - pymdownx.tasklist
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  # - pymdownx.emoji
  # Local (run well)
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
        # (wwhen build for production)
        # - pymdownx.emoji:
        # emoji_index: !!python/name:material.extensions.emoji.twemoji
        # emoji_generator: !!python/name:material.extensions.emoji.to_svg


plugins:
  - search:
      lang: en

docs_dir: docs
site_dir: site

nav:
  - 🏠 Home:
      - Overview: index.md

  - 👤 User Guide:
      - Overview: user-guide/overview.md
      - Quick Start: user-guide/quickstart.md
      - Smart Mode: user-guide/smart-mode.md
      - Commands: user-guide/commands.md
      - Dry-run Safety: dry-run.md
      - Installation: user-guide/installation-methods.md
      - Lifecycle: user-guide/lifecycle.md

  - 🧑‍💻 Developer Guide:
      - Getting Started: developer-guide/getting-started.md
      - Make Workflow: developer-guide/make-workflow.md
      - Docker Workflow: developer-guide/docker-workflow.md
      - AI Development Workflow: developer-guide/blackbox/ai-development-workflow.md
      - Tooling:
          - Ruff Ignore Rules: developer-guide/tooling/ruff/ruff-ignore.md
          - Ruff Select Rules: developer-guide/tooling/ruff/ruff-select.md

  - 🏗 Architecture:
      - Design Patterns: architecture/design-patterns.md
      - Workflow: architecture/workflow.md
      - Diagrams: architecture/diagrams.md

  - 🧪 Testing:
      - Testing Guide: testing/testing-guide.md

  - 🗺 Project:
      - Project Structure: project/project-structure.md

  - 📖 Reads:
      - Documentation Audit Report: reads/documentation-audit-report.md
      - Linting vs Formatting: reads/linting-vs-formatting.md
      - Ruff: reads/ruff.md

  - 📌 Reference:
      - Installation: installation.md
      - Usage: usage.md
      - Configuration: configuration.md
      - Infrastructure: infrastructure.md
      - CI/CD: ci-cd.md
      - Badges: badges.md
      - TODO Tracking History: TODO_tracking_history.md

extra:
