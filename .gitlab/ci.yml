# =========================================================
# 🧪 Validation & Continuous Integration
# =========================================================
#
# GitHub Equivalent
# -----------------
# .github/workflows/ci.yml
#
# Purpose
# -------
# Execute validation and testing jobs.
#
# Responsibilities
# ----------------
# - Install project dependencies
# - Execute validation workflow
# - Verify compatibility across Python versions
#
# Trigger Sources
# ---------------
# - Pushes
# - Merge Requests
# - Manual Pipelines
#
# =========================================================

ci:test:
  stage: test

  image: python:$PYTHON_VERSION

  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.9"
          # - "3.12"
          # - "3.13"
          - "3.14"

  before_script:
    - python --version

    - python -m pip install --upgrade pip

    - pip install -e ".[test]"

  script:
    - make test-ci

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

    # Every tag is tested; the package gate reports unsupported formats.
    - if: '$CI_COMMIT_TAG'

    - if: '$CI_COMMIT_BRANCH == "main"'

    - if: '$CI_COMMIT_BRANCH == "develop"'

    - if: '$CI_COMMIT_BRANCH == "dev"'

ci:quality:
  stage: test

  image: python:3.14

  before_script:
    - python --version

    - python -m pip install --upgrade pip

    - pip install -e ".[dev]"

  script:
    - make format-check-ci

    - make lint-ci

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

    - if: '$CI_COMMIT_TAG'

    - if: '$CI_COMMIT_BRANCH == "main"'

    - if: '$CI_COMMIT_BRANCH == "develop"'

    - if: '$CI_COMMIT_BRANCH == "dev"'
